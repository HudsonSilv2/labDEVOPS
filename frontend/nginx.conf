server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O navegador chama /api/status. O Nginx envia ao contêiner backend.
    location /api/ {
        proxy_pass http://backend:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
